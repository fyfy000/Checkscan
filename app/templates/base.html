<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}ChequeScript{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,640;1,9..144,560&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>ChequeScript</span>
      </a>
      <nav class="nav" aria-label="Pages">
        <a href="/" {% if active == "home" %}aria-current="page"{% endif %}>Files</a>
        <a href="/settings" {% if active == "settings" %}aria-current="page"{% endif %}>Settings</a>
      </nav>
    </div>
  </header>
  <main id="content" class="wrap">
    {% if error %}
      <div class="banner bad" role="alert">{{ error }}</div>
    {% endif %}
    {% if notice %}
      <div class="banner good" role="status">{{ notice }}</div>
    {% endif %}
    {% block body %}{% endblock %}
  </main>
  <footer class="foot wrap">Files stay on this computer. A cheque image is sent out only when you click Read handwriting.</footer>
  <script src="/static/js/app.js"></script>
</body>
</html>
